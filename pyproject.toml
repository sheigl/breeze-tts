[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breeze-tts"
version = "0.1.0"
description = "Breeze TTS 2 — real-time, low-latency streaming text-to-speech."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "pytorch-triton-xpu>=3.5.0,<3.5.1",
    "qwen-tts==0.1.1",
    "transformers==4.57.3",
    "numpy>=2.0",
    "soundfile>=0.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
torchaudio = { index = "pytorch-xpu" }
pytorch-triton-xpu = { index = "pytorch-xpu" }

[tool.hatch.build.targets.wheel]
packages = ["breeze_infer", "models"]
force-include = { "infer.py" = "infer" }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
